name: Supabase 与仓库云端保活

on:
  schedule:
    - cron: '17 11 * * *'
      timezone: Asia/Shanghai
    - cron: '23 10 1 * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      run_repository_keepalive:
        description: 同时执行一次仓库保活提交
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-daily-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: 访问数据库
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: 检查云端配置
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "缺少 Supabase 云端配置"
            exit 1
          fi

      - name: 发送只读心跳
        shell: bash
        run: |
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --output /dev/null \
            "${SUPABASE_URL%/}/rest/v1/settings?select=value&limit=1" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Accept: application/json"

  repository-keepalive:
    name: 更新仓库保活记录
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '23 10 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_repository_keepalive == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 获取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提交保活记录
        shell: bash
        run: |
          printf 'Last repository keepalive: %s\n' \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            > .github/heartbeat-activity.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat-activity.txt
          git commit -m "chore: monthly repository keepalive"
          git push origin HEAD:main
